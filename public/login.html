<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - لوحة التحكم</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .error { color: red; font-size: 14px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
      <button type="submit">دخول</button>
    </form>
    <div id="errorMsg" class="error">كلمة المرور غير صحيحة</div>
  </div>

  <!-- ربط ملف الجافاسكريبت الخارجي بدل الكود المباشر -->
  <script src="login.js"></script>
</body>
</html>
